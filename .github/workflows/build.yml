name: Build and test
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application
        run: g++ -std=c++17 -Wall -Wextra StudentRoster/main.cpp StudentRoster/roster.cpp StudentRoster/student.cpp -o student-roster
      - name: Check roster ownership
        run: |
          g++ -std=c++17 -fsanitize=address,undefined -g -I StudentRoster tests/roster_test.cpp StudentRoster/roster.cpp StudentRoster/student.cpp -o roster-test
          ./roster-test
